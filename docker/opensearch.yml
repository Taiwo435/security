# Cluster
cluster.name: audit-test-cluster
node.name: node-1

# Network
network.host: 0.0.0.0

# SSL-only mode — no auth, no RBAC, just TLS + audit
plugins.security.ssl_only: true

# TLS - Transport
plugins.security.ssl.transport.enabled: true
plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: certs/root-ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false

# TLS - REST/HTTP (with client cert auth OPTIONAL for CN/SAN testing)
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: certs/node.pem
plugins.security.ssl.http.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: certs/root-ca.pem
plugins.security.ssl.http.clientauth_mode: OPTIONAL

# Standalone Audit Logging — log4j sink (shows in docker logs)
plugins.security.audit.type: log4j
plugins.security.audit.config.log4j.logger_name: audit
plugins.security.audit.config.log4j.level: INFO

# Log request body
plugins.security.audit.config.log_request_body: true

# Log headers (exclude Authorization)
plugins.security.audit.config.exclude_sensitive_headers: true

# Resolve wildcards to actual indices
plugins.security.audit.config.resolve_indices: true

# Resolve bulk sub-operations individually
plugins.security.audit.config.resolve_bulk_requests: true

# Ignore kibanaserver user (demo: show this works)
plugins.security.audit.config.ignore_users:
  - kibanaserver

# Ignore internal cluster noise
plugins.security.audit.config.ignore_requests:
  - "cluster:monitor/*"
  - "indices:monitor/*"
  - "indices:admin/seq_no/*"
  - "indices:admin/mapping/auto_put"
  - "indices:admin/auto_create"

# Unified disabled_categories (works in tandem with split settings)
plugins.security.audit.config.disabled_categories:
  - AUTHENTICATED
  - GRANTED_PRIVILEGES

# Split settings (both unified and split apply additively)
plugins.security.audit.config.disabled_rest_categories:
  - SSL_EXCEPTION
  - BAD_HEADERS
plugins.security.audit.config.disabled_transport_categories:
  - SSL_EXCEPTION
  - BAD_HEADERS
